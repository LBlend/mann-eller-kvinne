# Default/template file for hyperparameters of rnn model

random_seed: 42

# Automatically infers
output_folder: "rnn"
log_folder: "rnn"

# Loading parameters
batch_size: 64
buffer_size: 10000

# Model paramaters
bidirectional: True

model_shapes:
    vocab_size: 10000
    sequence_length: 600
    embedding: 128
    lstm: 64
    dense: 64
    # Output layer is constant
    # output: 1

dropout:
    embedding: 0.2
    dense: 0.4

optimizer_type: "Adam"

optimizer_args:
    learning_rate: 1e-3

early_stopper:
    patience: 3
    restore_best_weights: True
    verbose: 1

epochs: 50
