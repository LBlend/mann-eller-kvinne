[project]
name = "mann-eller-kvinne"
version = "4.0.0"
description = "A website that guesses whether you're a man or a woman based on what you type"
readme = "README-en.md"
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.135.*",
    "pydantic==2.12.*",
    "pydantic-settings==2.13.*",
    "uvicorn[standard]==0.41.*",
    "python-dotenv==1.2.*",
    "tensorflow==2.20.*",
    "keras==3.15.*",
    "scikit-learn==1.8.*",
    "numpy==2.4.*",
    "scipy==1.17.*",
    "joblib==1.5.*",
    "nltk==3.10.*",
    "pyyaml==6.0.*",
    "requests==2.34.*",
    "certifi==2026.2.25",
    "charset-normalizer==3.4.*",
    "urllib3==2.7.*",
    "click==8.3.*",
    "tqdm==4.67.*",
    "h5py==3.15.*",
]

[dependency-groups]
dev = [
    "flake8",
]

[tool.uv]
package = false
