name: Python Linting

on:
  push:
    paths:
      - "src/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Flake8 Lint
        run: uv run flake8 --max-line-length=120 --show-source
